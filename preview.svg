  </defs>

  <rect x="10" y="30" width="340" height="150" rx="10" fill="#141414" stroke="#000000" stroke-width="1"/>

  <circle cx="34" cy="46" r="5" fill="#33d933"/>
  <text x="185" y="51" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#ffd100">Combo Points</text>

  <g>
    <circle cx="80"  cy="96" r="20" fill="url(#pipOn)" stroke="#000" stroke-width="1"/>
    <circle cx="130" cy="96" r="20" fill="url(#pipOn)" stroke="#000" stroke-width="1"/>
    <circle cx="180" cy="96" r="20" fill="url(#pipOn)" stroke="#000" stroke-width="1"/>
    <circle cx="230" cy="96" r="20" fill="url(#pipOn)" stroke="#000" stroke-width="1"/>
    <circle cx="280" cy="96" r="20" fill="url(#pipOff)" stroke="#000" stroke-width="1"/>
