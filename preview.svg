  <text x="180" y="147" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#ffffff">96 / 120</text>

  <rect x="326" y="164" width="14" height="14" fill="#ffffff" fill-opacity="0.35"/>

  <text x="180" y="10" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#8a8a8a" font-style="italic">4/5 combo points, 96/120 energy (Vigor talent active)</text>
