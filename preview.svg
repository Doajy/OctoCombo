<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
  <defs>
    <radialGradient id="pipOn" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f0503f"/>
      <stop offset="100%" stop-color="#d9261a"/>
    </radialGradient>
    <radialGradient id="pipOff" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#333333"/>
